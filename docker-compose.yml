services:

    # Reverse proxy server
    webserver:
        image: nginxproxy/nginx-proxy:1.11
        container_name: router-nginx
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - ./config/nginx_common:/etc/nginx/conf.d
          - ./config/nginx_hosts:/etc/nginx/vhost.d
          - ./dhparam:/etc/nginx/dhparam
          - ./certs:/etc/nginx/certs:ro
          - ./html:/usr/share/nginx/html
          - /var/run/docker.sock:/tmp/docker.sock:ro
        networks:
            - nginx-proxy
        extra_hosts:
            host.docker.internal: host-gateway
        restart: unless-stopped

    # SSL companion
    letsencrypt:
        image: nginxproxy/acme-companion:2.6
        container_name: router-letsencrypt
        environment:
            # Без этого companion не находит контейнер nginx (нет ни метки
            # com.github.nginx-proxy.nginx, ни volumes_from) и падает с
            # "Error: can't get nginx-proxy container ID !"
            - NGINX_PROXY_CONTAINER=router-nginx
            # Контакт ACME для проектов без своего LETSENCRYPT_EMAIL
            - DEFAULT_EMAIL=r.safronik@gmail.com
        volumes:
            - ./config/nginx_hosts:/etc/nginx/vhost.d
            - ./certs:/etc/nginx/certs:rw
            - ./html:/usr/share/nginx/html
            - ./acme.sh:/etc/acme.sh
            - /var/run/docker.sock:/var/run/docker.sock:ro
        restart: unless-stopped

networks:

    # Common network for other services
    nginx-proxy:
        driver: bridge
        name: nginx-proxy
